[package]
name = "pike-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ipnet = "2.11"
ring = "0.17"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
pike-core = { path = "../pike-core" }
tokio = { workspace = true }
quiche = { workspace = true }
tokio-quiche = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["auth", "limit"] }
hyper = { workspace = true }
# `server-auto` is what axum::serve already enables; the bounded HTTP serving
# helper in `http/serve.rs` drives the same connection type directly.
hyper-util = { workspace = true, features = ["server-auto"] }
tokio-tungstenite = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
async-stream = { workspace = true }
redis = { version = "0.27", features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
deadpool-redis = "0.18"
toml = { workspace = true }
uuid = { workspace = true }
postcard = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
prometheus = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md5 = "0.8"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
futures-util = "0.3"
http-body-util = "0.1"
# Optional error monitoring (fix #6). Disabled at runtime unless SENTRY_DSN is set; uses the
# rustls transport to avoid pulling in OpenSSL (the rest of the stack is rustls-based).
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.34"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = { version = "0.18.1", default-features = false }
rusqlite = { version = "0.32.1", features = ["bundled"] }


instant-acme = { version = "0.8.5", default-features = false, features = ["ring"] }
fs2 = "0.4.3"
webpki-roots = "1.0"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
# Already in the lock file through instant-acme; tests generate their own
# throwaway CA instead of reading operator certificate files.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
