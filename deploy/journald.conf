# Pike journald size cap
#
# pike-server logs to the systemd journal (see pike-server.service:
# StandardOutput=journal / StandardError=journal). This drop-in caps the
# on-disk size of the persistent journal so logs can never fill the VPS disk.
#
# SystemMaxUse is a system-wide journald setting (the [Journal] section is not
# a per-service directive), which on a dedicated Pike relay host effectively
# bounds the pike-server logs. Adjust the cap to taste.
#
# Install as a journald drop-in:
#   sudo install -m 0644 journald.conf /etc/systemd/journald.conf.d/pike.conf
#   sudo systemctl restart systemd-journald
#
# Verify the effective cap:
#   journalctl --disk-usage
#   sudo journalctl --vacuum-size=500M   # one-off manual trim if needed

[Journal]
# Hard cap on total persistent journal size (default is up to 10% of the fs).
SystemMaxUse=500M
# Keep some headroom free on the filesystem.
SystemKeepFree=200M
# Cap the size of any single journal file so rotation happens regularly.
SystemMaxFileSize=100M
# Bound retention by age as a secondary guard.
MaxRetentionSec=1month
